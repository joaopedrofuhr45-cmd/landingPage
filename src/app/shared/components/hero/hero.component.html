<section class="hero">
  <div class="hero-content">
    <span class="hero-tag">Organize. Planeje. Realize.</span>
    <h1>Organize suas tarefas <span>e aumente sua produtividade.</span></h1>
    <p>
      Tenha controle das suas tarefas de forma simples, rápida e eficiente.
      Organize sua rotina e foque no que realmente importa.
    </p>

    <div class="hero-buttons">
      <app-button [routerLink]="['/cadastro']">Começar agora</app-button>
      <a routerLink="/inicio" fragment="sobre" class="btn btn-outline">Saiba mais</a>
    </div>
  </div>

  <div class="hero-card">
    <div class="hero-card-header">
      <h2>Minhas tarefas</h2>
      <app-button>+ Nova tarefa</app-button>
    </div>

    <div class="task-list">
      <app-task-preview-item title="Estudar Java" status="Pendente" />
      <app-task-preview-item title="Fazer exercícios" status="Pendente" />
      <app-task-preview-item title="Projeto da faculdade" status="Concluída" [completed]="true" />
    </div>
  </div>
</section>
