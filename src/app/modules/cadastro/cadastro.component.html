<div class="login-page">
  <div class="login-container">
    <!-- Lado esquerdo -->
    <section class="welcome-section">
      <div class="logo">
        <span class="logo-icon">✓</span>
        <span>Todo-list</span>
      </div>

      <div class="welcome-content">
        <h1>Comece agora!</h1>

        <h2>Foque no que <span>realmente importa.</span></h2>

        <p>
          Crie sua conta e organize suas tarefas de forma simples e eficiente.
        </p>
      </div>

      <div class="illustration">
        <div class="clipboard">
          <div class="clip"></div>

          <div class="task">
            <span class="check">✓</span>
            <div>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="task">
            <span class="check">✓</span>
            <div>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="task">
            <span class="empty-check"></span>
            <div>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <div class="clock">
          <div class="clock-hand hour"></div>
          <div class="clock-hand minute"></div>
        </div>
      </div>
    </section>

    <!-- Lado direito -->
    <section class="form-section">
      <div class="form-container">
        <a routerLink="/inicio" class="back-link"> ← Voltar para o início </a>

        <h1>Criar conta</h1>

        <p class="description">
          Preencha os dados abaixo para criar sua conta.
        </p>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <!-- Nome -->
          <div class="input-group">
            <label for="name">Nome</label>

            <div class="input-wrapper">
              <span class="input-icon">👤</span>

              <input
                id="name"
                type="text"
                placeholder="Digite seu nome"
                formControlName="name"
              />
            </div>
          </div>

          <!-- E-mail -->
          <div class="input-group">
            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <span class="input-icon">✉</span>

              <input
                id="email"
                type="email"
                placeholder="Digite seu e-mail"
                formControlName="email"
              />
            </div>
          </div>

          <!-- Senha -->
          <div class="input-group">
            <label for="password">Senha</label>

            <div class="input-wrapper">
              <span class="input-icon">🔒</span>

              <input
                id="password"
                type="password"
                placeholder="Digite sua senha"
                formControlName="password"
              />
            </div>
          </div>

          <!-- Confirmar senha -->
          <div class="input-group">
            <label for="passwordConfirmation">Confirmar senha</label>

            <div class="input-wrapper">
              <span class="input-icon">🔒</span>

              <input
                id="passwordConfirmation"
                type="password"
                placeholder="Digite sua senha novamente"
                formControlName="passwordConfirmation"
              />
            </div>
          </div>

          <button type="submit" class="login-button" [disabled]="isLoading">
            {{ isLoading ? "Cadastrando..." : "Cadastrar" }}
          </button>

          <!-- Já tem conta -->
          <p class="register-text">
            Já tem uma conta?
            <a routerLink="/login">Entrar</a>
          </p>
        </form>
      </div>
    </section>
  </div>
</div>
